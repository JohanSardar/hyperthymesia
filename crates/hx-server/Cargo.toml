[package]
name = "hx-server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hx-schema.workspace = true
hx-sources = { path = "../hx-sources" }
hx-visual.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
hx-store.workspace = true
hx-jobs.workspace = true
hx-compile.workspace = true
hx-interpret.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
axum.workspace = true
maud.workspace = true
sqlx.workspace = true
zstd.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom = "0.4"
base64 = "0.22"
tempfile.workspace = true
ulid.workspace = true
url = "2"
rusqlite = { workspace = true, features = ["hooks", "limits"] }

[dev-dependencies]
hx-jobs = { workspace = true, features = ["test-support"] }
hx-store = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
