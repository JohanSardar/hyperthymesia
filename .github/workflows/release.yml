name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Artifact-only PR coverage also bootstraps this workflow before it is on main.
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HX_SIGN_IDENTITY: '-'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
          - runner: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Isolate release build and output directories
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hx-release-target" >> "$GITHUB_ENV"
          echo "HX_RELEASE_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Import Developer ID on the macOS runner only
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64$APPLE_CERTIFICATE_PASSWORD$APPLE_SIGN_IDENTITY$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_PASSWORD" ]]; then
            echo 'No Apple secrets: using ad-hoc signing.'
            exit 0
          fi
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Incomplete Apple signing configuration: missing $name"
              exit 1
            fi
          done
          [[ "$APPLE_SIGN_IDENTITY" == 'Developer ID Application:'* ]] || {
            echo '::error::APPLE_SIGN_IDENTITY must be a Developer ID Application identity'; exit 1;
          }
          keychain="$RUNNER_TEMP/hx-release.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          echo "HX_SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo 'HX_NOTARIZE=1' >> "$GITHUB_ENV"
      - name: Build release assets
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build-release.sh
      - name: Verify real installer against the produced archives
        shell: bash
        run: |
          scratch_home=$(mktemp -d "$RUNNER_TEMP/hx-installer-home.XXXXXXXX")
          trap 'rm -rf "$scratch_home"' EXIT
          # The real installer downloads and verifies pinned fx independently.
          # A network/download failure must fail visibly, never skip this check.
          if ! HOME="$scratch_home" HX_RELEASE_BASE="file://$HX_RELEASE_DIR" \
              sh "$HX_RELEASE_DIR/install.sh" --dry-run; then
            echo '::error::Installer dry run failed. See the download/hash diagnostics above; pinned fx must be reachable.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          if [[ -f "$RUNNER_TEMP/hx-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/hx-release.keychain-db"
          fi

  clean-linux:
    name: Clean Linux (${{ matrix.platform }})
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 10
    steps:
      # Pristine Ubuntu userspace: no extra packages, Rust, database or fx.
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: assets
      - name: Run the shipped binary with an empty environment
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/hx-clean.XXXXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          # Use the archive's name as the independent expected CLI version.
          asset=$(find assets -name "hx-server-*-$PLATFORM.tar.gz" -print)
          version=${asset#assets/hx-server-}
          version=${version%-"$PLATFORM".tar.gz}
          tar -xzf "$asset" -C "$scratch"
          mkdir "$scratch/home"
          actual=$(env -i HOME="$scratch/home" PATH=/usr/bin:/bin "$scratch/hx-server" --version)
          [[ "$actual" == "hx-server $version" ]] || {
            echo "::error::Expected hx-server $version, got $actual"; exit 1;
          }
          echo "$actual"

  assemble:
    name: Assemble verified assets
    needs: [build, clean-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: incoming
      - name: Combine assets and write strict SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil

          out = Path('release')
          out.mkdir()
          for path in sorted(Path('incoming').glob('*/*')):
              if path.name == 'SHA256SUMS':
                  continue
              destination = out / path.name
              if destination.exists() and destination.read_bytes() != path.read_bytes():
                  raise SystemExit(f'Conflicting asset: {path.name}')
              shutil.copyfile(path, destination)
          if len(list(out.glob('hx-server-*.tar.gz'))) != 3 or len(list(out.glob('Hyperthymesia-*.zip'))) != 1 or not (out / 'install.sh').is_file():
              raise SystemExit('Incomplete release asset set')
          with (out / 'SHA256SUMS').open('w') as sums:
              for path in sorted(out.iterdir()):
                  if path.name != 'SHA256SUMS':
                      sums.write(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n')
          PY
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hyperthymesia-release
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish owner-tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyperthymesia-release
          path: release
      - name: Create GitHub Release from the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "Hyperthymesia $TAG" --generate-notes
