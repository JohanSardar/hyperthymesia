name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Installer core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline installer contracts (scratch HOME, stubbed services)
        run: sh scripts/install.test.sh

  rust-linux:
    name: Rust (Linux, server side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-store-transactions.py
      - run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --exclude hx-macos-sys --exclude hx-agent --exclude hx-agent-app -- -D warnings
      - name: test
        run: cargo test --workspace --exclude hx-macos-sys --exclude hx-agent --exclude hx-agent-app

  mover-postgres:
    name: Mover (synthetic Postgres cutover)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hx
          POSTGRES_PASSWORD: hx
          POSTGRES_DB: hx
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hx -d hx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Move and verify a fresh migration-10 synthetic database
        env:
          HX_MOVE_TEST_POSTGRES: postgres://hx:hx@localhost:5432/hx
        run: cargo test -p hx-move --test postgres -- --ignored

  rust-macos:
    name: Rust (macOS, capture agent)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy -p hx-macos-sys -p hx-agent -p hx-agent-app -p hx-visual --all-targets -- -D warnings
      - name: test
        run: cargo test -p hx-macos-sys -p hx-agent -p hx-agent-app -p hx-visual

      - name: synthetic pairing harness
        run: |
          cargo clippy -p hx-agent -p hx-agent-app --all-targets --features e2e-harness -- -D warnings
          cargo test -p hx-agent -p hx-agent-app --features e2e-harness
          scripts/check-e2e-harness.sh

  companions:
    name: Companions (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: test each companion that has a package.json
        run: |
          for d in companions/*/; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && bun install --frozen-lockfile 2>/dev/null || bun install) && (cd "$d" && bun test)
            fi
          done
